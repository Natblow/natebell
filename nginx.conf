server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path proxy → America Buys on GCE (Kamal host americabuys.nathanbellow.com).
    # Strip /americabuys so Rails sees normal routes; Rails generates prefixed URLs
    # via RAILS_RELATIVE_URL_ROOT=/americabuys.
    location = /americabuys {
        return 301 https://$host/americabuys/;
    }

    location ^~ /americabuys/ {
        proxy_pass https://136.64.62.196/;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name americabuys.nathanbellow.com;
        proxy_ssl_verify off;

        proxy_set_header Host americabuys.nathanbellow.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /americabuys;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";

        proxy_redirect https://americabuys.nathanbellow.com/ /americabuys/;
        proxy_redirect http://americabuys.nathanbellow.com/ /americabuys/;
        proxy_redirect https://136.64.62.196/ /americabuys/;
        proxy_redirect http://136.64.62.196/ /americabuys/;
        proxy_cookie_path / /americabuys/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
