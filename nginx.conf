server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Path proxy → America Buys on GCE.
    # Strip /americabuys so the upstream sees normal routes.
    location = /americabuys {
        return 301 https://$host/americabuys/;
    }

    location ^~ /americabuys/ {
        # Origin kamal-proxy TLS cert for bare IP is gone (LE will not issue for IPs).
        # Edge TLS stays on natebell; forward HTTP and tell Rails the public scheme.
        proxy_pass http://136.64.62.196/;
        proxy_http_version 1.1;

        proxy_set_header Host 136.64.62.196;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /americabuys;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";

        # Rails already emits RAILS_RELATIVE_URL_ROOT (/americabuys) in Location.
        # Rewrite the origin host only — do not prefix a second /americabuys.
        proxy_redirect https://136.64.62.196/americabuys/ /americabuys/;
        proxy_redirect http://136.64.62.196/americabuys/ /americabuys/;
        proxy_redirect https://136.64.62.196/ /americabuys/;
        proxy_redirect http://136.64.62.196/ /americabuys/;
        proxy_cookie_path / /americabuys/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
