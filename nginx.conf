server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # America Buys moved to https://americabuys.co/americabuys (2026-10-11; a GCP load
    # balancer serves it now). Permanent redirects keep the path and query, so old links,
    # bookmarks, sitemaps, Buy links (/americabuys/r/<token>) and MCP OAuth discovery land
    # on the new host. America Buys runbook: "Public URL and the domain move", step 10.
    location = /americabuys {
        return 301 https://americabuys.co/americabuys/$is_args$args;
    }

    location ^~ /americabuys/ {
        return 301 https://americabuys.co$request_uri;
    }

    location ^~ /.well-known/oauth-authorization-server/americabuys/ {
        return 301 https://americabuys.co$request_uri;
    }

    location ^~ /.well-known/oauth-protected-resource/americabuys/ {
        return 301 https://americabuys.co$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
